version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 1
    ignore:
      # Keep aligned with engines.vscode floor — a newer type bump would
      # let us silently use APIs unavailable on the minimum supported VSCode.
      - dependency-name: '@types/vscode'
    groups:
      npm-all:
        patterns:
          - '*'
        update-types:
          - major
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 1
    groups:
      gha-all:
        patterns:
          - '*'
