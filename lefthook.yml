# See https://lefthook.dev/configuration/

pre-commit:
  parallel: true
  commands:
    lint:
      glob: '*.{ts,tsx,js,jsx,mjs,cjs}'
      run: pnpm exec oxlint {staged_files}
      stage_fixed: true
    format:
      glob: '*.{ts,tsx,js,jsx,mjs,cjs,json,jsonc}'
      run: pnpm exec oxfmt {staged_files}
      stage_fixed: true
    typecheck:
      glob: '*.{ts,tsx}'
      run: pnpm exec tsgo --noEmit

pre-push:
  commands:
    test:
      run: pnpm test
