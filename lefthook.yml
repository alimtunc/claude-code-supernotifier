# See https://lefthook.dev/configuration/

pre-commit:
  parallel: true
  commands:
    lint:
      glob: '*.{ts,js,json,jsonc}'
      run: pnpm exec oxlint {staged_files}
      stage_fixed: true
    format:
      glob: '*.{ts,js,json,jsonc,md,yml,yaml}'
      run: pnpm exec prettier --write {staged_files}
      stage_fixed: true
    typecheck:
      glob: '*.{ts,tsx}'
      run: pnpm exec tsgo --noEmit

pre-push:
  commands:
    test:
      run: pnpm test
